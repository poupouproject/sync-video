<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Synchro vidéo hommage</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; color: #fff;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }
  #setup {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 24px; overflow-y: auto;
  }
  h1 { font-size: 28px; margin-bottom: 4px; }
  .sub { color: #aaa; margin-bottom: 24px; }
  .step { margin: 16px 0; max-width: 460px; }
  .step label { display:block; margin-bottom:8px; font-size:16px; color:#ddd; }
  input[type="file"], input[type="time"] {
    font-size: 16px; padding: 8px; background:#111; color:#fff;
    border:1px solid #444; border-radius:6px; width: 100%;
  }
  .quick button { margin: 0 6px; }
  button {
    font-size: 18px; padding: 12px 22px; margin-top: 10px;
    background: #1e6f3e; color: #fff; border: none; border-radius: 8px;
    cursor: pointer;
  }
  button:disabled { background: #333; color: #777; cursor: not-allowed; }
  button.secondary { background: #333; font-size: 14px; padding: 8px 14px; }
  #clockNow { margin-top: 22px; color: #888; font-size: 15px; }
  #fileName { margin-top: 6px; color: #7ecb9a; font-size: 14px; min-height: 18px; }
  #syncStatus { margin-top: 10px; font-size: 14px; min-height: 18px; }
  #syncStatus.ok { color: #7ecb9a; }
  #syncStatus.off { color: #d98c3a; }

  #waiting {
    height: 100%; display: none; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: #000;
  }
  #waiting.active { display: flex; }
  #countdown {
    font-size: 96px; font-variant-numeric: tabular-nums;
    font-weight: 600; letter-spacing: 2px;
  }
  #waiting p { color: #999; font-size: 18px; }
  #targetDisplay { color: #fff; font-weight: 600; }

  video {
    display: none;
    width: 100vw; height: 100vh; object-fit: contain;
    background: #000;
  }
  video.active { display: block; }

  #drift {
    display: none; position: fixed; bottom: 12px; right: 14px; z-index: 10;
    font: 13px/1.4 Consolas, monospace; color: #7ecb9a;
    background: rgba(0,0,0,.6); padding: 6px 10px; border-radius: 6px;
  }
  #drift.active { display: block; }
</style>
</head>
<body>

<div id="setup">
  <h1>Synchro vidéo hommage</h1>
  <div class="sub">À faire pareil sur les deux ordinateurs</div>

  <div class="step">
    <label>1. Choisir le fichier vidéo (sur la clé USB)</label>
    <input type="file" id="fileInput" accept="video/*">
    <div id="fileName"></div>
  </div>

  <div class="step">
    <label>2. Heure de départ — mets la MÊME heure sur les deux postes</label>
    <input type="time" id="targetTime" step="1">
    <div class="quick">
      <button class="secondary" id="setPlus3">Départ dans 3 min</button>
      <button class="secondary" id="setPlus5">Départ dans 5 min</button>
      <button class="secondary" id="setPlus10">Départ dans 10 min</button>
    </div>
  </div>

  <button id="prepareBtn" disabled>3. Préparer et attendre le départ</button>

  <div id="syncStatus"></div>
  <div id="clockNow"></div>
</div>

<div id="waiting">
  <p>Départ programmé à <span id="targetDisplay"></span></p>
  <div id="countdown">--:--</div>
  <p>Heure actuelle : <span id="liveClock2"></span></p>
</div>

<video id="video" loop playsinline></video>
<div id="drift"></div>

<script>
  // Le service de synchro est déployé avec cette page : même origine, donc chemin relatif.
  // Si tu ouvres ce fichier depuis une clé USB (file://), remplace-le par l'URL complète
  // du déploiement, ex. 'https://sync-video-hommage-xxxx.vercel.app/api/time'.
  const SYNC_URL = '/api/time';

  const fileInput = document.getElementById('fileInput');
  const syncStatusEl = document.getElementById('syncStatus');
  const targetTimeInput = document.getElementById('targetTime');
  const prepareBtn = document.getElementById('prepareBtn');
  const setupDiv = document.getElementById('setup');
  const waitingDiv = document.getElementById('waiting');
  const countdownEl = document.getElementById('countdown');
  const targetDisplayEl = document.getElementById('targetDisplay');
  const clockNowEl = document.getElementById('clockNow');
  const liveClock2El = document.getElementById('liveClock2');
  const fileNameEl = document.getElementById('fileName');
  const video = document.getElementById('video');
  const driftEl = document.getElementById('drift');

  let selectedFile = null;
  let targetDate = null;
  let countdownTimer = null;
  let driftTimer = null;
  let resyncTimer = null;
  let clockOffsetMs = 0; // correction à appliquer à Date.now() pour avoir l'heure "réelle"
  let clockSynced = false; // vrai dès qu'une synchro serveur a réussi au moins une fois
  let lastPosition = 0;    // position au tour de boucle précédent, pour détecter le rebouclage
  let started = false;     // la lecture synchronisée a été lancée
  let bestRoundTrip = Infinity; // meilleure latence vue jusqu'ici, pour juger les re-synchros
  let wakeLock = null;     // empêche l'écran de s'éteindre pendant l'attente

  // Politique de recalage. Un saut en pleine image se voit ; à la frontière de
  // boucle, l'image change de toute façon, donc c'est là qu'on réaligne.
  const DRIFT_OK_MS = 40;      // ~1 image : sous ce seuil on ne touche à rien
  const NUDGE_RATE = 0.02;     // rattrapage doux en cours de plan (0 = ne rien faire hors boucle)
  const DRIFT_PANIC_MS = 2000; // décrochage franc : on saute sans attendre la boucle
                               // (Infinity = ne jamais sauter ailleurs qu'à la boucle)

  function pad(n) { return String(n).padStart(2, '0'); }
  function correctedNow() { return Date.now() + clockOffsetMs; }
  function nowStr() {
    const d = new Date(correctedNow());
    return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }
  function refreshClocks() {
    clockNowEl.textContent = 'Heure actuelle (corrigée) sur cet ordinateur : ' + nowStr();
    liveClock2El.textContent = nowStr();
  }
  setInterval(refreshClocks, 1000);
  refreshClocks();

  function checkReady() {
    prepareBtn.disabled = !(selectedFile && targetTimeInput.value);
  }

  fileInput.addEventListener('change', () => {
    selectedFile = fileInput.files[0] || null;
    fileNameEl.textContent = selectedFile ? ('Fichier choisi : ' + selectedFile.name) : '';
    checkReady();
    if (!selectedFile) return;

    // Le recalage repose sur la durée. Certains fichiers (MP4 mal finalisé, WebM
    // sans en-tête de durée) ne la donnent pas : autant le savoir avant le soir.
    const probe = document.createElement('video');
    probe.preload = 'metadata';
    probe.onloadedmetadata = () => {
      const ok = isFinite(probe.duration) && probe.duration > 0;
      fileNameEl.textContent = 'Fichier choisi : ' + selectedFile.name
        + (ok ? ' (' + Math.round(probe.duration) + ' s)'
              : ' — ATTENTION : durée inconnue, le recalage ne fonctionnera pas avec ce fichier');
      URL.revokeObjectURL(probe.src);
    };
    probe.onerror = () => {
      fileNameEl.textContent = 'Fichier choisi : ' + selectedFile.name
        + ' — ATTENTION : ce navigateur ne sait pas lire ce fichier';
      URL.revokeObjectURL(probe.src);
    };
    probe.src = URL.createObjectURL(selectedFile);
  });

  targetTimeInput.addEventListener('input', checkReady);

  function setInMinutes(mins) {
    const d = new Date(correctedNow() + mins * 60000);
    targetTimeInput.value = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    checkReady();
  }
  document.getElementById('setPlus3').addEventListener('click', () => setInMinutes(3));
  document.getElementById('setPlus5').addEventListener('click', () => setInMinutes(5));
  document.getElementById('setPlus10').addEventListener('click', () => setInMinutes(10));

  function parseTargetTime(value) {
    const parts = value.split(':').map(Number);
    const h = parts[0] || 0, m = parts[1] || 0, s = parts[2] || 0;
    const d = new Date(correctedNow());
    d.setHours(h, m, s, 0);
    // Une heure déjà passée est une lecture en cours à rejoindre (PC redémarré
    // en plein hommage), pas un rendez-vous pour demain. On ne bascule au
    // lendemain que si l'heure est franchement derrière, au-delà de 12 h.
    if (d.getTime() < correctedNow() - 12 * 3600000) {
      d.setDate(d.getDate() + 1);
    }
    return d;
  }

  // --- Synchro d'horloge via le serveur (style NTP simplifié) ---
  async function syncWithServer() {
    if (location.protocol === 'file:' && SYNC_URL.startsWith('/')) {
      if (!clockSynced) clockOffsetMs = 0;
      syncStatusEl.textContent = 'Page ouverte en local — synchro par horloge locale des deux PC.';
      syncStatusEl.className = 'off';
      return;
    }

    syncStatusEl.textContent = 'Synchronisation avec le serveur...';
    syncStatusEl.className = '';

    const samples = [];
    for (let i = 0; i < 5; i++) {
      try {
        const t0 = Date.now();
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 2500);
        const resp = await fetch(SYNC_URL, { cache: "no-store", signal: controller.signal });
        clearTimeout(timeout);
        const t1 = Date.now();
        const data = await resp.json();
        const roundTrip = t1 - t0;
        const estServerAtT1 = data.serverTime + roundTrip / 2;
        samples.push({ roundTrip, offset: estServerAtT1 - t1 });
      } catch (e) {
        // ignore cet échantillon, on continue
      }
    }

    if (samples.length === 0) {
      // Un échec ne doit jamais remettre l'offset à zéro : pendant la lecture ça
      // provoquerait un saut brutal. On garde le dernier décalage connu.
      if (!clockSynced) clockOffsetMs = 0;
      syncStatusEl.textContent = clockSynced
        ? 'Serveur injoignable — on garde le dernier décalage connu.'
        : 'Serveur injoignable — repli sur l\'horloge locale des deux PC.';
      syncStatusEl.className = 'off';
      return;
    }

    samples.sort((a, b) => a.roundTrip - b.roundTrip);
    const best = samples[0];

    // L'erreur d'estimation est bornée par la moitié de l'aller-retour. Une fois
    // synchronisé, on refuse une mesure nettement plus lente que ce qu'on a déjà
    // vu : un coup de wifi mou ne doit pas déplacer l'horloge en pleine lecture.
    if (clockSynced && best.roundTrip > Math.max(bestRoundTrip * 3, 300)) {
      syncStatusEl.textContent = 'Mesure trop lente (' + best.roundTrip + ' ms) — décalage conservé.';
      syncStatusEl.className = 'off';
      return;
    }

    clockOffsetMs = best.offset;
    bestRoundTrip = Math.min(bestRoundTrip, best.roundTrip);
    clockSynced = true;
    syncStatusEl.textContent = 'Synchro serveur OK (décalage corrigé : ' + Math.round(clockOffsetMs) + ' ms).';
    syncStatusEl.className = 'ok';
  }

  prepareBtn.addEventListener('click', async () => {
    if (!selectedFile) return;

    prepareBtn.disabled = true;
    prepareBtn.textContent = 'Synchronisation...';
    await syncWithServer();
    prepareBtn.textContent = '3. Préparer et attendre le départ';

    targetDate = parseTargetTime(targetTimeInput.value);

    const url = URL.createObjectURL(selectedFile);
    video.src = url;
    video.muted = false;

    // Pré-chargement : on lance puis on coupe pour forcer le décodage. Si le
    // départ est déjà passé, startVideo() peut avoir joué avant que cette
    // promesse revienne : dans ce cas on ne coupe surtout pas.
    video.play().then(() => {
      if (started) return;
      video.pause();
      video.currentTime = 0;
    }).catch(() => {});

    const el = document.documentElement;
    if (el.requestFullscreen) { el.requestFullscreen().catch(() => {}); }

    // Pendant le décompte rien ne bouge à l'écran : sans ça, l'économiseur ou la
    // mise en veille peut se déclencher avant le départ. Demandé ici car il faut
    // un geste utilisateur ; sans support (http, vieux navigateur) on continue.
    if (navigator.wakeLock) {
      navigator.wakeLock.request('screen').then((lock) => { wakeLock = lock; }).catch(() => {});
    }

    setupDiv.style.display = 'none';
    waitingDiv.classList.add('active');
    targetDisplayEl.textContent = pad(targetDate.getHours()) + ':' + pad(targetDate.getMinutes()) + ':' + pad(targetDate.getSeconds());

    countdownTimer = setInterval(updateCountdown, 250);
    updateCountdown();
  });

  function updateCountdown() {
    const diffMs = targetDate.getTime() - correctedNow();
    if (diffMs <= 0) {
      clearInterval(countdownTimer);
      startVideo();
      return;
    }
    const totalSec = Math.ceil(diffMs / 1000);
    const mm = Math.floor(totalSec / 60);
    const ss = totalSec % 60;
    countdownEl.textContent = pad(mm) + ':' + pad(ss);
  }

  // --- Recalage pendant la lecture ---
  // La position de lecture n'est jamais déduite de "on a démarré, donc ça suit" :
  // elle est recalculée depuis l'heure corrigée. Deux PC qui partagent la même
  // heure de départ et la même durée de vidéo visent donc toujours la même image,
  // y compris après plusieurs tours de boucle.
  function expectedPosition() {
    const d = video.duration;
    if (!isFinite(d) || d <= 0) return null;
    const elapsedSec = (correctedNow() - targetDate.getTime()) / 1000;
    if (elapsedSec < 0) return null;
    return elapsedSec % d;
  }

  // Écart en ms, positif si on est en avance. Calculé de façon circulaire pour que
  // la frontière de boucle (fin -> début) ne soit pas lue comme un écart énorme.
  function driftMs(expected) {
    const d = video.duration;
    let err = (((video.currentTime - expected) % d) + d) % d;
    if (err > d / 2) err -= d;
    return err * 1000;
  }

  function correctDrift() {
    if (video.paused || video.seeking || video.readyState < 3) return;
    const expected = expectedPosition();
    if (expected === null) {
      if (driftEl.classList.contains('active')) {
        driftEl.textContent = 'durée de la vidéo inconnue — recalage impossible avec ce fichier';
      }
      return;
    }
    const err = driftMs(expected);
    const abs = Math.abs(err);

    // La lecture est repartie en arrière : on vient de reboucler. C'est le moment
    // où un saut ne coûte rien, puisque l'image change déjà.
    const wrapped = video.currentTime < lastPosition - 1;
    lastPosition = video.currentTime;

    if (abs <= DRIFT_OK_MS) {
      video.playbackRate = 1;
    } else if (wrapped || abs > DRIFT_PANIC_MS) {
      video.playbackRate = 1;
      video.currentTime = expected;
    } else if (NUDGE_RATE > 0) {
      // Hors boucle on ne saute jamais : on est en avance -> ralentir, en retard
      // -> accélérer. 2 % ne s'entend pas et se rattrape en quelques secondes.
      video.playbackRate = err > 0 ? 1 - NUDGE_RATE : 1 + NUDGE_RATE;
    } else {
      video.playbackRate = 1; // recalage remis au prochain tour de boucle
    }

    if (driftEl.classList.contains('active')) {
      driftEl.textContent = 'écart ' + (err > 0 ? '+' : '') + Math.round(err) + ' ms'
        + ' · vitesse ' + video.playbackRate.toFixed(2)
        + ' · offset serveur ' + Math.round(clockOffsetMs) + ' ms';
    }
  }

  function startVideo() {
    started = true;
    waitingDiv.classList.remove('active');
    video.classList.add('active');
    video.loop = true;

    // On ne démarre pas forcément pile à l'heure (timer à 250 ms, latence de play).
    // Plutôt que de partir de 0 avec ce retard figé, on se place à la position due.
    // Si la durée n'est pas encore connue (on rejoint une lecture en cours juste
    // après avoir choisi le fichier), on se placera dès qu'elle l'est.
    function seekToExpected() {
      const expected = expectedPosition();
      if (expected !== null && expected > 0.05) video.currentTime = expected;
    }
    if (isFinite(video.duration) && video.duration > 0) {
      seekToExpected();
    } else {
      video.addEventListener('loadedmetadata', seekToExpected, { once: true });
    }

    video.play().catch(() => {
      video.addEventListener('click', () => video.play(), { once: true });
    });
    const el = document.documentElement;
    if (el.requestFullscreen && !document.fullscreenElement) {
      el.requestFullscreen().catch(() => {});
    }

    // Sondage fréquent pour attraper le rebouclage dans les premières images du
    // tour suivant ; ce n'est pas pour autant une correction plus fréquente.
    lastPosition = video.currentTime;
    driftTimer = setInterval(correctDrift, 250);
    // L'horloge du PC dérive aussi : on retape le serveur régulièrement. Un échec
    // est sans conséquence, le dernier décalage connu reste en place.
    resyncTimer = setInterval(syncWithServer, 60000);
  }

  // Le verrou d'écran tombe dès que la fenêtre est masquée (alt-tab pendant le
  // décompte) : on le redemande au retour, tant que la vidéo n'a pas démarré.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && wakeLock && !started && navigator.wakeLock) {
      navigator.wakeLock.request('screen').then((lock) => { wakeLock = lock; }).catch(() => {});
    }
  });

  // Touche "d" : affiche l'écart mesuré, pour vérifier l'alignement sans deviner.
  document.addEventListener('keydown', (e) => {
    if (e.key === 'd' || e.key === 'D') driftEl.classList.toggle('active');
  });

  // Première synchro dès le chargement : l'heure affichée est déjà corrigée et on
  // voit tout de suite si le service répond. Re-synchro juste avant le départ.
  syncWithServer();
</script>

</body>
</html>
